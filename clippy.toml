# Clippy configuration. Lint levels live in Cargo.toml [workspace.lints].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false

# Proper nouns that doc_markdown would otherwise ask to wrap in backticks.
doc-valid-idents = ["ClusterIP", "KubeSolo", "UserInfo", "OpenID", "WebAuthn", "PostgreSQL", "EdDSA", "JWKs", "GitOps", "AuthenticationConfiguration", "MacBook", "ChromeOS", ".."]
